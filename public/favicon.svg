<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Medical Cross Badge in Top Right -->
  <g transform="translate(86, 16)" filter="url(#glow)">
    <circle cx="14" cy="14" r="14" fill="#047857" opacity="0.9" />
    <path d="M11 6h6v5h5v6h-5v5h-6v-5H6v-6h5V6z" fill="#ffffff" />
  </g>

  <!-- Stylized Spine Vertebrae Column & Physiological Curvature -->
  <g transform="translate(64, 66) scale(1)" filter="url(#glow)">
    <!-- Cervical vertebra (C1-C2) -->
    <ellipse cx="0" cy="-38" rx="16" ry="6.5" fill="url(#spineGrad)" />
    <circle cx="0" cy="-38" r="3" fill="#0284c7" />

    <!-- Vertebra connector 1 -->
    <path d="M-6 -34 C -10 -26, -12 -22, -18 -18 L 18 -18 C 12 -22, 10 -26, 6 -34 Z" fill="rgba(255,255,255,0.4)" />

    <!-- Thoracic vertebra (T1-T6) -->
    <ellipse cx="0" cy="-18" rx="21" ry="8" fill="url(#spineGrad)" />
    <circle cx="0" cy="-18" r="3.5" fill="#0284c7" />

    <!-- Vertebra connector 2 -->
    <path d="M-8 -12 C -14 -4, -16 2, -24 6 L 24 6 C 16 2, 14 -4, 8 -12 Z" fill="rgba(255,255,255,0.5)" />

    <!-- Lumbar vertebra (L1-L5) - primary focus of physio -->
    <ellipse cx="0" cy="6" rx="26" ry="9.5" fill="url(#spineGrad)" />
    <circle cx="0" cy="6" r="4.2" fill="#0369a1" />

    <!-- Sacrum base -->
    <path d="M -16 16 C -20 25, -12 36, 0 42 C 12 36, 20 25, 16 16 Z" fill="url(#crossGrad)" opacity="0.95" />
    <circle cx="0" cy="27" r="3" fill="#ffffff" />
  </g>

  <!-- Dynamic Physiological Wave Wings -->
  <path d="M 22 72 Q 40 50, 64 64 T 106 58" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 24 80 Q 44 60, 64 74 T 104 68" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
</svg>
